<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSS | Stuffing Report System</title>
<style>
:root{--bg:#f1f2f1;--card:#fff;--ink:#292d2f;--mut:#6b7072;--line:#d8dcda;--green:#217849;--green-dark:#17643b;--green-pale:#e7f2eb;--ok:#217849;--bad:#b43c35;--navy:#217849;--gold:#dcefe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:50px}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Arial,Helvetica,sans-serif}
nav{display:flex;gap:7px;align-items:center;background:var(--green);padding:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;min-height:43px;box-shadow:0 1px 2px #0001}nav b{color:#fff;margin-right:auto;letter-spacing:.02em;font-size:14px}nav button{background:transparent;border:0;color:#e8f3ec;padding:7px 11px;border-radius:2px;font:inherit;cursor:pointer}nav button.on,nav button:hover{background:#fff;color:var(--green-dark);font-weight:700}
main{max-width:1440px;margin:0 auto;padding:18px 20px 50px}h1{font-size:22px;margin:4px 0 12px;font-weight:700}h2{font-size:15px;margin:0 0 10px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}input,select{width:100%;padding:8px 9px;border:1px solid #c4c9c6;border-radius:0;background:#fff;color:var(--ink);font:inherit;min-height:32px}input:focus,select:focus{outline:2px solid #8dbda0;outline-offset:0}
button.p,button.g{background:var(--green);color:#fff;border:0;padding:9px 15px;border-radius:0;font:inherit;cursor:pointer}button.g{font-weight:600}button.s{background:#fff;border:1px solid #bfc6c1;color:var(--ink);padding:8px 13px;border-radius:0;font:inherit;cursor:pointer}button:hover:not(:disabled){filter:brightness(.96)}button:disabled{opacity:.4;cursor:not-allowed}
.steps{display:flex;gap:0;margin-bottom:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.steps span{padding:9px 13px;background:#e9ebe9;border:1px solid var(--line);font-size:12px;color:var(--mut);cursor:pointer}.steps span.on{background:var(--green);color:#fff;border-color:var(--green)}.steps span.done{color:var(--green-dark);background:var(--green-pale)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-size:11px;color:#5c6260;font-weight:700;padding:8px;background:#f0f1f0;border:1px solid var(--line)}.tbl td{padding:7px;border:1px solid var(--line);background:#fff}.pill{display:inline-block;padding:3px 8px;border-radius:2px;color:#fff;font-size:11px;font-weight:600}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chk{display:flex;gap:8px;padding:6px 0;font-size:13px}.chk i{font-style:normal;font-weight:700}.ok i{color:var(--ok)}.bad i{color:var(--bad)}.bad{color:var(--bad)}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}.slot{border:1px dashed #bfc8c2;border-radius:0;overflow:hidden;background:#f7f8f7;position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mut);cursor:pointer;padding:8px}.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.slot em{position:absolute;left:0;right:0;bottom:0;background:rgba(22,72,43,.86);color:#fff;padding:4px 6px;font-style:normal;font-size:11px}.slot.have{border:2px solid var(--green)}.slot input{display:none}
.paper{background:#fff;color:#111;font:12px/1.4 Georgia,serif;padding:28px;border:1px solid var(--line);max-width:780px;margin:0 auto}.paper h3{text-align:center;font-size:20px;margin:0 0 4px}.paper .lg{text-align:center;color:#217849;font:700 12px sans-serif;letter-spacing:.1em;margin-bottom:14px;border-bottom:2px solid #217849;padding-bottom:6px}.paper table{width:100%;border-collapse:collapse;margin:10px 0}.paper td,.paper th{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top}.paper .kv td{border:0;padding:1px 6px}.paper .ph{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.paper .ph div{border:1px solid #bbb;aspect-ratio:4/3;position:relative;background:#eee}.paper .ph img{width:100%;height:100%;object-fit:cover;display:block}.paper .ph small{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font:10px sans-serif;padding:2px 4px}.stamp{display:inline-block;border:3px double #217849;color:#217849;border-radius:50%;width:110px;height:110px;text-align:center;font:700 10px/1.2 sans-serif;padding-top:34px;transform:rotate(-12deg);opacity:.85}.note{font-size:12px;color:var(--mut)}#ocrPreview{white-space:pre-wrap;max-height:280px;overflow:auto;background:#f7f8f7;border:1px solid var(--line);padding:10px;font:12px/1.5 ui-monospace,monospace}
@media(max-width:650px){main{padding:12px 10px 35px}nav{padding:7px 9px}nav button{padding:7px 8px}h1{font-size:20px}.card{padding:12px}.paper{padding:14px}.tbl{min-width:520px}}@media print{nav,.noprint{display:none!important}body{background:#fff}.paper{border:0}}
</style></head><body>
<nav><b>▣ GLOBAL SAFEZONE&nbsp; | &nbsp;STUFFING REPORTS</b><button id="n1">Overview</button><button id="n2">New job</button><button id="n3">Complete a report</button></nav>
<main id="app"></main>
<script>
const SLOTS=[["empty","Empty container, doors open"],["closed","Doors closed, container no."],["lin1","Lining being installed",1],["lin2","Lining done, doors closed",1],["start","Loading started"],["full","Fully loaded"],["door1","One door closed + no."],["closedfull","Both doors closed"],["seal","Door with seals"],["sealcu","Seal close-up"]];
const STAT=["Draft","Photos captured","Report ready","Sent"],COL={"Draft":"#5b6b7c","Photos captured":"#2f5d8c","Report ready":"#c9a24b","Sent":"#2e7d5b"};
const SAMPLE={container:"MEDU6162531",booking:"EBKG18349475",transporter:"NEXUS FLOW LOGISTICS LTD",driver:"MUHIRE CLEMENT",truck:"RAK 147 D/RL9115",border:"RUSUMO, DAR ES SALAAM",pod:"HAMBURG, GERMANY",lots:[["028/095/26012","ABATERANINKUNGA BA SHOLI",80,4800,4880],["028/095/26014","ABATERANINKUNGA BA SHOLI",110,6600,6710],["028/095/26016","ABATERANINKUNGA BA SHOLI",20,1200,1220],["028/095/26018","ABATERANINKUNGA BA SHOLI",110,6600,6710]]};
let jobs=[];
let view="tracker",step=1,J=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function newJob(){J={id:Date.now(),order:null,rep:{vessel:"",consignee:"",notify:"",bl:"",shipper:"",from:"KIGALI, RWANDA",to:"",goods:"Rwanda Arabica green coffee, fully washed"},lining:false,photos:{},tally:{container:"",rows:[0,0,0,0,0,0],gross:0,bagKg:60,customs:"",shipperSeal:"",date:"",time:""},stamp:true,scans:{},files:{},names:{},state:{},insp:{results:{}},photoRead:{containers:[],seals:[]},surveyor:"Surveyor 1",status:"Draft",to:"export@example.com"};step=1;view="job";draw()}
function iso(c){c=(c||"").toUpperCase().replace(/\s/g,"");if(!/^[A-Z]{4}\d{7}$/.test(c))return false;let v=10,m={};for(const ch of"ABCDEFGHIJKLMNOPQRSTUVWXYZ"){if(v%11==0)v++;m[ch]=v++}let s=0;for(let i=0;i<10;i++)s+=(i<4?m[c[i]]:+c[i])*2**i;return(s%11)%10==+c[10]}
const slots=()=>SLOTS.filter(s=>!s[2]||J.lining),bagsOrder=()=>J.order?J.order.lots.reduce((a,l)=>a+ +l[2],0):0,bagsTally=()=>J.tally.rows.reduce((a,b)=>a+ +b,0),bagsRep=()=>bagsTally()||bagsOrder();
function checks(){const o=J.order,t=J.tally,n=bagsTally(),net=n*t.bagKg,r=[],add=(ok,m)=>r.push({ok,m});
add(!!o,"Loading order data loaded");if(!o)return r;
if(o.totals&&o.totals.bags)add(bagsOrder()==o.totals.bags,`Lot rows (${bagsOrder()} bags) match the order\u2019s stated total (${o.totals.bags})`);
add(n==bagsOrder(),`Tally bags (${n}) match loading order (${bagsOrder()})`);
add(net==o.lots.reduce((a,l)=>a+ +l[3],0),`Net ${net.toLocaleString()} kg matches loading order net`);
add(+t.gross-net==n,`Gross − net = ${(t.gross-net).toLocaleString()} kg (expected ${n} kg bag tare)`);
add(t.container.toUpperCase()==o.container.toUpperCase(),`Tally container (${t.container}) matches loading order (${o.container})`);
add(iso(o.container),`Container ${o.container} passes ISO 6346 check digit`);
const I=J.insp;if(I.container)add(I.container.toUpperCase()==o.container.toUpperCase(),`Checklist container (${I.container}) matches loading order`);if(I.seal&&t.customs)add(I.seal==t.customs,`Checklist seal (${I.seal}) matches tally customs seal`);const fl=Object.entries(I.results||{}).filter(e=>e[1]=="fail");if(Object.values(I.results||{}).some(Boolean))add(!fl.length,fl.length?`${fl.length} checklist point(s) failed`:"All checklist points passed");const PR=J.photoRead;if(PR.containers.length)add(PR.containers.every(c=>c.toUpperCase()==o.container.toUpperCase()),`Container on photos (${[...new Set(PR.containers)].join(", ")}) matches loading order`);if(PR.seals.length&&(t.customs||t.shipperSeal))add(PR.seals.every(x=>[t.customs,t.shipperSeal].includes(x)),`Seals on photos (${PR.seals.join(", ")}) match tally`);add(!!(t.customs&&t.shipperSeal),t.customs&&t.shipperSeal?"Customs and shipper seal numbers recorded":"Seal numbers missing");add(!!J.scans.tally,J.scans.tally?"Signed tally sheet scan attached":"Signed tally sheet scan missing");add(!!J.scans.insp,J.scans.insp?"Inspection checklist scan attached":"Inspection checklist scan missing");const miss=slots().filter(s=>!J.photos[s[0]]).length;add(!miss,miss?`${miss} required photo(s) missing`:"All required photos captured");return r}
function status(){const ph=!slots().some(s=>!J.photos[s[0]]);if(J.status!="Report ready"&&J.status!="Sent")J.status=ph&&J.order?"Photos captured":"Draft"}
function draw(){$("#n1").className=view=="tracker"?"on":"";$("#n2").className=view=="job"?"on":"";$("#n3").className=view=="complete"?"on":"";$("#app").innerHTML=view=="tracker"?tracker():view=="complete"?completeView():jobView()}
$("#n1").onclick=()=>{view="tracker";loadJobs()};$("#n2").onclick=()=>newJob();$("#n3").onclick=()=>newComplete();
function tracker(){const all=[...(J&&view!="x"&&!jobs.some(x=>x.id==J.id)&&J.order?[{...J,container:J.order.container,client:(J.order.lots[0]||[])[1],sample:0}]:[]),...jobs];
const cnt=s=>all.filter(j=>j.status==s).length;
return`<h1>Tracker</h1><div class="grid" style="margin-bottom:14px">${STAT.map(s=>`<div class="card" style="margin:0"><div class="note">${s}</div><div style="font-size:28px;font-weight:700;color:${COL[s]}">${cnt(s)}</div></div>`).join("")}</div>
<div class="card" style="overflow:auto"><table class="tbl"><tr><th>Container</th><th>Client</th><th>Surveyor</th><th>Status</th></tr>${all.map(j=>`<tr><td>${esc(j.container)}</td><td>${esc(j.client)}</td><td>${esc(j.surveyor)}</td><td><span class="pill" style="background:${COL[j.status]}">${j.status}</span></td></tr>`).join("")}</table><p class="note">Statuses update automatically as each job progresses.</p></div>
<button class="g" onclick="newJob()">+ New job</button>`}
function jobView(){const L=["1 Documents","2 Photos","3 Tally + scans","4 Report"];
let b=`<div class="steps">${L.map((l,i)=>`<span class="${step==i+1?"on":step>i+1?"done":""}" onclick="step=${i+1};draw()" style="cursor:pointer">${l}</span>`).join("")}</div>`;
b+=[s1,s2,s3,s4][step-1]();
b+=`<div class="row noprint">${step>1?`<button class="s" onclick="step--;draw()">Back</button>`:""}${step<4?`<button class="p" onclick="step++;draw()">Next</button>`:""}</div>`;return b}
function set(p,v,num){const k=p.split(".");let o=J;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=num?+v:v;status();draw()}
function f(l,p,v,num){return`<div><label>${l}</label><input value="${esc(v)}" ${num?'type="number"':""} onchange="set('${p}',this.value,${!!num})"></div>`}
function s1(){return docsCard()+s1b()+inspCard()}
function s1b(){const o=J.order;
let h=`<div style="display:none"><div class="row"><label class="s" style="display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:9px;cursor:pointer;margin:0;color:var(--ink)">Choose photo<input type="file" accept="image/*" hidden onchange="scan()"></label><button class="g" onclick="scan()">Scan sample loading order</button></div></div>`;
if(o)h+=`<div class="card"><h2>Confirm extracted data</h2><div class="grid">${f("Container no.","order.container",o.container)}${f("Booking","order.booking",o.booking)}${f("Transporter","order.transporter",o.transporter)}${f("Driver","order.driver",o.driver)}${f("Truck","order.truck",o.truck)}${f("Border","order.border",o.border)}${f("Port of discharge","order.pod",o.pod)}</div>
<div style="overflow:auto"><table class="tbl" style="margin-top:12px"><tr><th>Lot</th><th>Client</th><th>Bags</th><th>Net kg</th><th>Gross kg</th><th>Note</th></tr>${o.lots.map((l,i)=>`<tr><td><input value="${esc(l[0])}" onchange="set('order.lots.${i}.0',this.value)"></td><td><input value="${esc(l[1])}" onchange="set('order.lots.${i}.1',this.value)"></td><td><input type="number" value="${l[2]}" onchange="set('order.lots.${i}.2',this.value,true)"></td><td><input type="number" value="${l[3]}" onchange="set('order.lots.${i}.3',this.value,true)"></td><td><input type="number" value="${l[4]}" onchange="set('order.lots.${i}.4',this.value,true)"></td><td class="note">${esc((J.lotFlags||[])[i]||"")}</td></tr>`).join("")}<tr><th colspan="2">Total (order says ${o.totals?o.totals.bags:"?"} bags)</th><th>${bagsOrder()}</th><th>${o.lots.reduce((a,l)=>a+l[3],0)}</th><th>${o.lots.reduce((a,l)=>a+l[4],0)}</th><th></th></tr></table></div></div>
<div class="card"><h2>Report details</h2><div class="grid">${f("Vessel","rep.vessel",J.rep.vessel)}${f("Shipper","rep.shipper",J.rep.shipper)}${f("Consignee","rep.consignee",J.rep.consignee)}${f("Notify party","rep.notify",J.rep.notify)}${f("B/L number","rep.bl",J.rep.bl)}${f("To","rep.to",J.rep.to)}${f("Goods","rep.goods",J.rep.goods)}${f("Surveyor","surveyor",J.surveyor)}</div></div>`;return h}
function scan(){J.order=JSON.parse(JSON.stringify({...SAMPLE,lots:SAMPLE.lots}));J.rep.shipper="SAMPLE SHIPPER";J.rep.to="HAMBURG, GERMANY";status();draw()}
function s2(){const S=slots(),n=S.filter(s=>J.photos[s[0]]).length;
return`<div class="card"><h2>Guided photo capture <span class="note">${n}/${S.length}</span></h2><div class="row" style="margin:0 0 10px"><label style="display:inline-block;padding:10px 16px;border-radius:9px;cursor:pointer;margin:0;font-weight:600;background:var(--gold);color:#0f1f33">Upload all photos<input type="file" accept="image/*" multiple hidden onchange="bulk(this)"></label><span class="note">${esc(J.pstate||"Select all container photos at once (up to 16). They are sorted into slots automatically.")}</span></div><div class="row" style="margin:0 0 10px"><label style="margin:0;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" style="width:auto" ${J.lining?"checked":""} onchange="J.lining=this.checked;status();draw()"> Paper lining required</label></div><div class="slots">${S.map(s=>`<label class="slot ${J.photos[s[0]]?"have":""}">${J.photos[s[0]]?`<img src="${J.photos[s[0]]}">`:s[1]}<em>${s[1]}</em><input type="file" accept="image/*" capture="environment" onchange="pic('${s[0]}',this)"></label>`).join("")}</div><p class="note">Photos are placed in upload order. Review each slot and tap any slot to replace a photo; this version does not use AI to classify images.</p></div>`}
let busy="",err="";
function docsCard(){const d=[["order","Loading order"],["tally","Loading tally sheet"],["insp","Inspection checklist"]];return`<div class="card"><h2>Upload documents</h2><p class="note">Upload the loading order, the signed tally sheet and the inspection checklist (photo or PDF). Everything is read on this computer with Tesseract and rules; no data leaves it. The printed loading order is read automatically and cross-checked against its own totals. The handwritten tally and checklist are cropped beside each field for quick entry, and the checklist ticks are measured from the ink. Only the first page of a PDF is read.</p><div class="slots">${d.map(s=>`<label class="slot ${J.scans[s[0]]?"have":""}" style="aspect-ratio:3/4">${J.scans[s[0]]?`<img src="${J.scans[s[0]]}" style="object-fit:contain;background:#fff">`:"Tap to upload<br>"+s[1]}<em>${s[1]}${J.names[s[0]]?" \u00b7 "+esc(J.names[s[0]]):""}</em><input type="file" accept="image/*,application/pdf" onchange="upDoc('${s[0]}',this)"></label>`).join("")}</div><div class="row"><button class="s" ${J.files.order||J.files.tally||J.files.insp?"":"disabled"} onclick="extractAll()">Re-read documents</button><span class="note">${Object.entries(J.state).map(e=>e[0]+": "+e[1]).join(" \u00b7 ")}</span><button class="s" onclick="scan();readTally()">Use sample data</button></div><div style="margin-top:10px">${Object.entries(J.warn||{}).flatMap(([k,v])=>v.map(m=>`<div class="chk"><i>\u2022</i><span><b>${k}:</b> ${esc(m)}</span></div>`)).join("")}</div>${err?`<p class="bad">${esc(err)}</p>`:""}<p class="note">The loading order is required. Extracted values are shown below for you to confirm and edit.</p></div>`}
async function upDoc(k,el){const fl=el.files[0];if(!fl)return;err="";J.raw=J.raw||{};J.raw[k]=fl;J.names[k]=fl.name;J.files[k]=fl;J.scans[k]=fl.type.startsWith("image/")?URL.createObjectURL(fl):"";draw();extractDoc(k)}
function apply(r){if(r.order){const o=r.order;J.order={container:o.container||"",booking:o.booking||"",transporter:o.transporter||"",driver:o.driver||"",truck:o.truck||"",border:o.border||"",pod:o.pod||"",lots:(o.lots||[]).map(l=>[l.lot||"",l.client||"",+l.bags||0,+l.net||0,+l.gross||0])};if(o.pod)J.rep.to=o.pod}if(r.tally){const t=r.tally;Object.assign(J.tally,{container:t.container||"",customs:t.customs||"",shipperSeal:t.shipperSeal||"",date:t.date||"",time:t.time||"",rows:(t.rows&&t.rows.length?t.rows:J.tally.rows).map(Number),gross:+t.gross||0});if(t.client&&!J.rep.shipper)J.rep.shipper=t.client;if(t.destination&&!J.rep.to)J.rep.to=t.destination;if(t.commodity)J.rep.goods=t.commodity}status()}
const TC=k=>((J.crops||{}).tally||{})[k],IC=k=>((J.crops||{}).insp||{})[k];
function cf(l,p,v,num,crop){return`<div>${crop?`<img src="${crop}" style="width:100%;max-height:72px;object-fit:contain;background:#fff;border:1px solid var(--line);margin-bottom:4px">`:""}${f(l,p,v,num)}</div>`}
async function extractDoc(k){
  if(!J.files[k])return;J.state[k]="reading locally\u2026";draw();
  try{
    const fd=new FormData();fd.append("file",J.files[k],J.names[k]||k);fd.append("expected_bags",bagsOrder()||0);
    const r=await fetch("/api/extract/"+k,{method:"POST",body:fd});const d=await r.json();
    if(!r.ok)throw new Error(d.detail||"Reading failed");
    if(d.preview){const b=await(await fetch("data:image/jpeg;base64,"+d.preview)).blob();J.files[k]=b;J.scans[k]=URL.createObjectURL(b)}
    J.warn=J.warn||{};J.warn[k]=d.warnings||[];J.crops=J.crops||{};J.crops[k]=d.crops||{};const f=d.fields||{};
    if(k=="order"){
      J.order={container:f.container||"",booking:f.booking||"",transporter:f.transporter||"",driver:f.driver||"",truck:f.truck||"",border:f.border||"",pod:f.pod||"",totals:f.totals||null,lots:(f.lots||[]).map(l=>[l[0],l[1],+l[2]||0,+l[3]||0,+l[4]||0])};
      J.lotFlags=(f.lots||[]).map(l=>l[5]||"");if(f.pod)J.rep.to=f.pod;
      J.state.order=J.order.lots.length+" lots, "+bagsOrder()+" bags read"+(f.totals?" (order total "+f.totals.bags+")":"");
    }else if(k=="tally"){
      if(f.container)J.tally.container=f.container;if(f.date)J.tally.date=f.date;
      J.state.tally="photo attached; enter the handwritten values beside the crops";
    }else{
      J.insp={...J.insp,container:f.container||J.insp.container||"",date:f.date||J.insp.date||"",results:{...J.insp.results,...(f.results||{})}};
      const n=Object.values(f.results||{}).filter(Boolean).length;J.state.insp=n+" of 7 ticks read";
    }
  }catch(e){J.state[k]="error: "+(e.message||"failed");err=e.message||"Reading failed"}
  status();draw();
}
async function extractAll(){for(const k of["order","tally","insp"])if(J.files[k])await extractDoc(k)}
function inspCard(){const i=J.insp,R=i.results||{},N={outside:"Outside / undercarriage",doors:"Doors",right:"Right side",left:"Left side",front:"Front wall",ceiling:"Ceiling / roof",floor:"Floor"};if(!i.container&&!i.inspector&&!i.seal&&!Object.values(R).some(Boolean))return"";return`<div class="card"><h2>Inspection checklist data</h2><div class="grid">${cf("Container no.","insp.container",i.container||"",0,IC("container"))}${cf("Seal no.","insp.seal",i.seal||"",0,IC("seal"))}${f("Shipper","insp.shipper",i.shipper||"")}${f("Inspector","insp.inspector",i.inspector||"")}${cf("Date","insp.date",i.date||"",0,IC("date"))}</div><div class="grid" style="margin-top:10px">${Object.keys(N).map(k=>`<div><label>${N[k]}</label><select onchange="set('insp.results.${k}',this.value)">${["pass","fail",""].map(v=>`<option value="${v}" ${R[k]==v?"selected":""}>${v||"unclear"}</option>`).join("")}</select></div>`).join("")}</div></div>`}
async function bulk(el){
  const fls=[...el.files].slice(0,16);if(!fls.length)return;J.pstate="Reading photo times\u2026";draw();
  const o=fls.map((f,i)=>({f,i,t:""}));
  try{const fd=new FormData();fls.forEach(f=>fd.append("files",f,f.name));const r=await fetch("/api/exif",{method:"POST",body:fd});if(r.ok){const d=await r.json();o.forEach((x,i)=>x.t=d[i].ts||"")}}catch(e){}
  const timed=o.every(x=>x.t);
  o.sort(timed?(a,b)=>a.t<b.t?-1:a.t>b.t?1:a.i-b.i:(a,b)=>a.f.lastModified-b.f.lastModified||a.i-b.i);
  const av=slots().filter(s=>!J.photos[s[0]]);let n=0;
  for(let i=0;i<Math.min(o.length,av.length);i++){J.photos[av[i][0]]=URL.createObjectURL(o[i].f);n++}
  J.pstate=n+" photo(s) placed in shoot-list order by "+(timed?"camera capture time":"file date")+(o.length>av.length?" ("+(o.length-av.length)+" left over: no free slot)":"")+". Check each slot and replace any that do not match.";
  status();draw();
}
function readTally(){Object.assign(J.tally,{container:"DFSU2477629",rows:[54,55,55,55,54,47],gross:19520,bagKg:60,customs:"BS124352",shipperSeal:"EU30917212",date:"22/07/2026",time:"17:00-18:00"});J.insp={container:"DFSU2477629",seal:"BS124352",shipper:"KOPERATIVE NYAMPINGA",inspector:"",date:"22/07/2026",results:{outside:"pass",doors:"pass",right:"pass",left:"pass",front:"pass",ceiling:"pass",floor:"pass"}};draw()}
function scanUp(k,el){const fl=el.files[0];if(!fl)return;J.scans[k]=URL.createObjectURL(fl);status();draw()}
function pic(k,el){const fl=el.files[0];if(!fl)return;J.photos[k]=URL.createObjectURL(fl);status();draw()}
function s3(){const t=J.tally,n=bagsTally();
return`<div class="card"><h2>Loading tally</h2><p class="note">The signed paper tally stays the source of truth. These numbers are entered for automatic checks.</p><div class="grid">${t.rows.map((v,i)=>cf("Row "+(i+1)+" bags",`tally.rows.${i}`,v,1,(TC("rows")||[])[i])).join("")}</div><div class="grid" style="margin-top:10px">${cf("Container no. (tally)","tally.container",t.container,0,TC("container"))}${cf("Customs seal","tally.customs",t.customs,0,TC("customs"))}${cf("Shipper / carrier seal","tally.shipperSeal",t.shipperSeal,0,TC("shipperSeal"))}${cf("Stuffing date","tally.date",t.date,0,TC("date"))}${cf("Time in\u2013out","tally.time",t.time,0,TC("time"))}${f("Bag weight kg","tally.bagKg",t.bagKg,1)}${f("Gross weight kg","tally.gross",t.gross,1)}<div><label>Calculated</label><div style="padding:9px 0"><b>${n}</b> of <b>${bagsOrder()}</b> bags, net <b>${(n*t.bagKg).toLocaleString()}</b> kg</div></div></div></div>
<div style="display:none"><h2></h2><p class="note">Upload a photo or scan of the signed tally sheet and the inspection checklist. They are inserted into the report automatically.</p><div class="slots">${[["tally","Signed loading tally sheet"],["insp","Inspection checklist"]].map(s=>`<label class="slot ${J.scans[s[0]]?"have":""}" style="aspect-ratio:3/4">${J.scans[s[0]]?`<img src="${J.scans[s[0]]}" style="object-fit:contain;background:#fff">`:"Tap to upload<br>"+s[1]}<em>${s[1]}</em><input type="file" accept="image/*" onchange="scanUp('${s[0]}',this)"></label>`).join("")}</div></div>
<div class="card"><h2>Automatic checks</h2>${J.order?checks().map(c=>`<div class="chk ${c.ok?"ok":"bad"}"><i>${c.ok?"✓":"✗"}</i>${esc(c.m)}</div>`).join(""):"<p class='note'>Load a loading order first.</p>"}</div>`}
function s4(){const o=J.order;if(!o)return`<div class="card">Load a loading order first (step 1).</div>`;const c=checks(),bad=c.filter(x=>!x.ok),R=J.rep,t=J.tally;
const sent=J.status=="Sent";
return`<div class="card noprint"><h2>Checks</h2>${c.map(x=>`<div class="chk ${x.ok?"ok":"bad"}"><i>${x.ok?"✓":"✗"}</i>${esc(x.m)}</div>`).join("")}<div class="row"><label style="margin:0;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" style="width:auto" ${J.stamp?"checked":""} onchange="J.stamp=this.checked;draw()"> Apply e-stamp</label><button class="g" onclick="J.status='Report ready';draw()">Mark report ready</button><button class="g" onclick="dl()">Download PDF</button></div>
<div class="row"><div style="flex:1;min-width:200px"><label>Email to</label><input value="${esc(J.to)}" onchange="J.to=this.value"></div><button class="p" ${J.status=="Draft"||J.status=="Photos captured"?"disabled":""} onclick="J.status='Sent';draw()">${sent?"Sent ✓":"Send by email"}</button></div>${bad.length?`<p class="note">${bad.length} check(s) failing. The report can still be generated, but review before sending.</p>`:""}</div>
<div class="paper" id="report"><img src="/assets/header.png" alt="Global Safezone Solutions" style="width:100%;display:block;margin:-10px 0 8px"><h3>STUFFING REPORT</h3>
<table class="kv"><tr><td><b>VESSEL</b></td><td>${esc(R.vessel)}</td></tr><tr><td><b>DESCRIPTION</b></td><td>1×20ST of ${bagsRep()} bags of ${t.bagKg}kg each of ${esc(R.goods)}. Lots: ${o.lots.map(l=>l[0]).join(", ")}. Gross ${(+t.gross||o.lots.reduce((a,l)=>a+l[4],0)).toLocaleString()} kg, net ${(o.lots.reduce((a,l)=>a+l[3],0)||bagsRep()*t.bagKg).toLocaleString()} kg.</td></tr><tr><td><b>SHIPPER</b></td><td>${esc(R.shipper)}</td></tr><tr><td><b>CONSIGNEE</b></td><td>${esc(R.consignee)}</td></tr><tr><td><b>NOTIFY PARTY</b></td><td>${esc(R.notify)}</td></tr><tr><td><b>B/L NUMBER</b></td><td>${esc(R.bl)}</td></tr><tr><td><b>FROM / TO</b></td><td>${esc(R.from)} / ${esc(R.to)}</td></tr></table>
<p>We supervised stuffing through tallying and weighing, and below are our findings:</p>
<table><tr><th>No</th><th>Container</th><th>Customs seal</th><th>Shipper seal</th><th>Lot numbers</th><th>Bags</th></tr><tr><td>1</td><td>${esc(o.container)}</td><td>${esc(t.customs)}</td><td>${esc(t.shipperSeal)}</td><td>${o.lots.map(l=>l[0]).join("<br>")}</td><td>${bagsOrder()}</td></tr></table><table><tr><th>Lot</th><th>Client</th><th>Bags</th><th>Net kg</th><th>Gross kg</th></tr>${o.lots.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]}</td></tr>`).join("")}<tr><th colspan="2">Total</th><th>${bagsOrder()}</th><th>${o.lots.reduce((a,l)=>a+l[3],0)}</th><th>${o.lots.reduce((a,l)=>a+l[4],0)}</th></tr></table>
<p>Remarks: All bags were stuffed in apparently good and sound condition. Stuffing took place on ${esc(t.date||"—")}, ${esc(t.time)}.</p>
<b>Photographic record</b><div class="ph">${slots().map(s=>`<div>${J.photos[s[0]]?`<img src="${J.photos[s[0]]}">`:`<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font:11px sans-serif">Not captured</span>`}<small>${s[1]}</small></div>`).join("")}</div>
${[["tally","Loading tally sheet (signed)"],["insp","Container inspection checklist"]].map(s=>`<div style="page-break-before:always;margin-top:14px"><b>${s[1]}</b>${J.scans[s[0]]?`<img src="${J.scans[s[0]]}" style="width:100%;border:1px solid #bbb;margin-top:6px;display:block">`:`<p style="color:#999">Not attached</p>`}</div>`).join("")}
<div style="text-align:right">${J.stamp?`<span class="stamp">GSS<br>E-STAMP<br>${new Date().toLocaleDateString("en-GB")}</span>`:""}</div><img src="/assets/footer.png" alt="" style="width:100%;display:block;margin-top:14px"></div>`}
let _t;function persist(){if(!J||!J.order)return;clearTimeout(_t);_t=setTimeout(()=>fetch("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:J.id,container:J.order.container,client:(J.order.lots[0]||[])[1]||"",surveyor:J.surveyor,status:J.status})}).catch(()=>{}),600)}
async function loadJobs(){try{jobs=await(await fetch("/api/jobs")).json()}catch(e){}draw()}
function newComplete(){newJob();view="complete";J.rep0=null;J.keep=0;J.stampDate=new Date().toLocaleDateString("en-GB");draw()}
function completeView(){const R=J.rep0,n=Object.keys(J.photos).length,d=[["tally","Signed loading tally sheet"],["insp","Inspection checklist"]];
return`<h1>Complete an existing report</h1><p class="note">The stuffing report is already written. Upload it, add the photos, the signed tally sheet and the checklist, and export one PDF with everything inserted after the report.</p>
<div class="card"><h2>1. Stuffing report (PDF)</h2><div class="row" style="margin:0 0 10px"><label style="display:inline-block;padding:10px 16px;border-radius:9px;cursor:pointer;margin:0;font-weight:600;background:var(--gold);color:#0f1f33">Choose report PDF<input type="file" accept="application/pdf" hidden onchange="cRep(this)"></label><span class="note">${R?esc(R.name)+(R.pages?" \u00b7 "+R.pages+" page(s)":" \u00b7 reading\u2026")+(R.container?" \u00b7 "+esc(R.container):""):"No report uploaded yet."}</span></div>${R&&R.preview?`<img src="${R.preview}" style="max-width:240px;border:1px solid var(--line);border-radius:8px;display:block">`:""}${R&&R.pages>1?`<div style="max-width:300px;margin-top:10px">${f("Keep only the first N pages of the report (0 = keep all)","keep",J.keep||0,1)}</div><p class="note">Use this if the PDF already contains blank or old photo pages that the new pages should replace.</p>`:""}</div>
${s2().replace("Guided photo capture","2. Photos")}
<div class="card"><h2>3. Signed tally sheet and checklist</h2><div class="slots">${d.map(s=>`<label class="slot ${J.files[s[0]]?"have":""}" style="aspect-ratio:3/4">${J.scans[s[0]]?`<img src="${J.scans[s[0]]}" style="object-fit:contain;background:#fff">`:(J.files[s[0]]?"File attached":"Tap to upload<br>"+s[1])}<em>${s[1]}${J.names[s[0]]?" \u00b7 "+esc(J.names[s[0]]):""}</em><input type="file" accept="image/*,application/pdf" onchange="cScan('${s[0]}',this)"></label>`).join("")}</div><p class="note">Photo or PDF. These are not read, only inserted.</p></div>
<div class="card"><h2>4. Insert and export</h2><div class="grid"><div style="display:flex;align-items:end"><label style="margin:0;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" style="width:auto" ${J.stamp?"checked":""} onchange="J.stamp=this.checked;draw()"> Apply e-stamp to the tally and checklist pages</label></div>${f("Stamp date","stampDate",J.stampDate||"")}</div>
<p class="note">Will insert: ${n} photo(s), ${J.files.tally?"tally sheet":"no tally sheet"}, ${J.files.insp?"checklist":"no checklist"}.</p>
<div class="row"><button class="g" ${R&&R.pages&&(n||J.files.tally||J.files.insp)&&!J.busyC?"":"disabled"} onclick="cExport()">${J.busyC?"Building\u2026":"Insert and export PDF"}</button></div>${J.cerr?`<p class="bad">${esc(J.cerr)}</p>`:""}</div>`}
function cScan(k,el){const fl=el.files[0];if(!fl)return;J.files[k]=fl;J.names[k]=fl.name;J.scans[k]=fl.type.startsWith("image/")?URL.createObjectURL(fl):"";draw()}
async function cRep(el){const fl=el.files[0];if(!fl)return;J.cerr="";J.rep0={file:fl,name:fl.name,pages:0,container:"",preview:""};draw();
  try{const fd=new FormData();fd.append("file",fl,fl.name);const r=await fetch("/api/complete/inspect",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Could not read that PDF");J.rep0={file:fl,name:fl.name,pages:d.pages,container:d.container||"",preview:d.preview?"data:image/jpeg;base64,"+d.preview:""}}catch(e){J.rep0=null;J.cerr=e.message}draw()}
async function cExport(){J.busyC=true;J.cerr="";draw();
  try{const fd=new FormData();fd.append("report",J.rep0.file,J.rep0.name);fd.append("stamp",J.stamp?1:0);fd.append("date",J.stampDate||"");fd.append("keep",J.keep||0);
    for(const k in J.photos)fd.append("files",await(await fetch(J.photos[k])).blob(),"photo_"+k);
    for(const k of["tally","insp"])if(J.files[k])fd.append("files",J.files[k],"scan_"+k);
    const r=await fetch("/api/complete",{method:"POST",body:fd});if(!r.ok){let m="Could not build the PDF";try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}
    const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="Completed_"+(J.rep0.container||J.rep0.name.replace(/\.pdf$/i,""))+".pdf";a.click();
    fetch("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:J.id,container:J.rep0.container||J.rep0.name,client:"",surveyor:J.surveyor||"",status:"Report ready"})}).catch(()=>{})
  }catch(e){J.cerr=e.message}J.busyC=false;draw()}
async function dl(){try{const fd=new FormData();fd.append("job",JSON.stringify({order:J.order,rep:J.rep,tally:J.tally,insp:J.insp,lining:J.lining,stamp:J.stamp,surveyor:J.surveyor}));for(const k in J.photos){fd.append("files",await(await fetch(J.photos[k])).blob(),"photo_"+k)}for(const k of["tally","insp"])if(J.files[k])fd.append("files",J.files[k],"scan_"+k);const r=await fetch("/api/report",{method:"POST",body:fd});if(!r.ok)throw 0;const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="Stuffing_Report_"+(J.order.container||"container")+".pdf";a.click();J.status="Report ready";draw()}catch(e){alert("Could not generate the PDF.")}}
const _draw=draw;draw=function(){_draw();persist()};
loadJobs();
</script></body></html>
